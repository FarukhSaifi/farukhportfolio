name: Dependabot Auto-Fix (build patch)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-patch:
    name: Run auto-fix and create patch
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint auto-fix
        run: |
          if [ -f eslint.config.mjs ] || [ -f eslint.config.js ] || [ -f .eslintrc.json ]; then
            npx eslint --fix . || true
          fi

      - name: Run npm audit fix
        run: npm audit fix || true

      - name: Create patch file
        run: |
          mkdir -p /tmp/autofix
          git diff > /tmp/autofix/autofix.patch
          echo "${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/autofix/head_sha.txt
          echo "${{ github.event.pull_request.head.ref || github.ref_name }}" > /tmp/autofix/head_ref.txt

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: autofix-patch-${{ github.event.pull_request.number || github.run_id }}
          path: /tmp/autofix/
          retention-days: 1

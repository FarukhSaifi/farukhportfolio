name: Dependabot Auto-Fix (apply patch)

on:
  workflow_run:
    workflows: ["Dependabot Auto-Fix (build patch)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-patch:
    name: Apply patch and push to PR branch
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download patch artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a =>
              a.name.startsWith('autofix-patch-')
            );
            if (!match) {
              console.log('No autofix patch artifact found');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/autofix.zip', Buffer.from(download.data));

      - name: Extract artifact and prepare patch
        id: patch_meta
        run: |
          if [ -f /tmp/autofix.zip ]; then
            unzip -o /tmp/autofix.zip -d /tmp/autofix
            if [ -s /tmp/autofix/autofix.patch ]; then
              echo "has_patch=true" >> $GITHUB_OUTPUT
              echo "head_ref=$(cat /tmp/autofix/head_ref.txt)" >> $GITHUB_OUTPUT
            else
              echo "has_patch=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_patch=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone PR branch, apply patch, and push
        if: steps.patch_meta.outputs.has_patch == 'true'
        env:
          HEAD_REF: ${{ steps.patch_meta.outputs.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" -b "$HEAD_REF" /tmp/pr-repo
          cd /tmp/pr-repo
          git apply /tmp/autofix/autofix.patch || git apply --reject /tmp/autofix/autofix.patch || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(deps): automated lint and dependency fixes [skip ci]"
            git push origin "$HEAD_REF"
            echo "Successfully pushed automated fixes to $HEAD_REF"
          else
            echo "No changes after applying patch."
          fi
